name: Build Xiaomi MiR3 OpenWrt

on:
  workflow_dispatch:
  push:
    branches:
      - 18.06.2

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev \
          libglib2.0-dev libelf-dev qemu-utils device-tree-compiler
          
          # 修复旧版 OpenWrt 脚本对 'python' 命令的依赖
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Configuration
        run: |
          # 确保使用仓库根目录的 .config，如果没有则生成默认
          [ -e .config ] && echo "Using existing .config" || make defconfig

      - name: Download Library
        run: |
          # 使用 FORCE=1 绕过旧版脚本对特定编译器版本的严格检查
          make download -j8 FORCE=1
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          echo -e "$(nproc) thread compile"
          # 核心编译步骤，失败时切换到单线程输出详细错误日志
          make -j$(nproc) FORCE=1 || make -j1 V=s FORCE=1

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: MiR3_OpenWrt_Firmware
          path: bin/targets/ramips/mt7620/*.bin
